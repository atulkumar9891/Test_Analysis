version: 2
sources:
  - name: datafeed_shared_schema
    database: dbt_db
    schema: confirmed_layer
    
    tables:
      - name: stg_customers 
      - name: stg_payments
      - name: stg_orders
        columns:
          - name: ID
            tests:
            - not_null
            - unique
          - name: STATUS
            tests:
             - accepted_values:
                values: ['placed', 'shipped','completed', 'returned', 'return_pending']

      - name: products
      - name: employees
      - name: customers
